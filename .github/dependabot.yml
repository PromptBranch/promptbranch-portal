# Dependabot version updates.
# This file only takes effect from the default branch (main).
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# pnpm uses package-ecosystem "npm". The root pnpm-lock.yaml (lockfileVersion 9.0,
# supported by Dependabot) covers the whole pnpm workspace, so the single root
# entry updates apps/portal and packages/share dependencies too.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Bundle minor/patch bumps into one PR; majors stay separate for review.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Base image tag bumps (node:xx-alpine) for the portal image.
  - package-ecosystem: "docker"
    directory: "/apps/portal"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
